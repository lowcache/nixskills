# Gates for the nix skill: sandbox checks (format, script compile, package build)
# plus the end-to-end nixops suite, which needs a live Nix daemon.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Same pinned SHAs as volnixos's build workflow.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Flake checks
        run: nix flake check -L
      - name: nixops end-to-end
        run: nix run .#test
